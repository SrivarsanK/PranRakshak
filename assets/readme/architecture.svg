<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Proposed PRAN RAKSHAK system architecture</title><desc id="desc">Wearable ESP32-C3 sensing and local warnings connect over Wi-Fi/MQTT to fixed nodes and a Raspberry Pi offline gateway. Gateway records telemetry and last-seen zones. Mesh, firmware and network tests remain pending.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-weight:700}</style>
<rect x="0" y="0" width="1200" height="460" rx="16" fill="#0b1728" stroke="none"/><text x="36" y="43" font-size="19" fill="#f2f7fc" font-weight="700">FROM THE WORKER TO THE LOCAL CONTROL ROOM</text><text x="36" y="72" font-size="15" fill="#b7c9db" font-weight="400">Proposed architecture · firmware and network validation pending</text><rect x="36" y="108" width="325" height="220" rx="12" fill="#12263d" stroke="#284660"/><text x="58" y="145" font-size="19" fill="#55dacb" font-weight="700">01 / SENSE &amp; WARN</text><text x="58" y="184" font-size="17" fill="#f2f7fc" font-weight="400">ESP32-C3 wearable node</text><text x="58" y="217" font-size="17" fill="#b7c9db" font-weight="400">CH4 · CO · conditioned H2S</text><text x="58" y="250" font-size="17" fill="#b7c9db" font-weight="400">Motion + manual panic input</text><text x="58" y="283" font-size="17" fill="#b7c9db" font-weight="400">Local vibration / display / alarm</text><rect x="440" y="108" width="320" height="220" rx="12" fill="#12263d" stroke="#284660"/><text x="462" y="145" font-size="19" fill="#55dacb" font-weight="700">02 / CONNECT LOCALLY</text><text x="462" y="184" font-size="17" fill="#f2f7fc" font-weight="400">Fixed monitoring nodes</text><text x="462" y="217" font-size="17" fill="#b7c9db" font-weight="400">Wi-Fi + MQTT baseline</text><text x="462" y="250" font-size="17" fill="#b7c9db" font-weight="400">Node identity + timestamps</text><text x="462" y="283" font-size="17" fill="#b7c9db" font-weight="400">Proposed mesh extension</text><rect x="838" y="108" width="326" height="220" rx="12" fill="#12263d" stroke="#284660"/><text x="860" y="145" font-size="19" fill="#55dacb" font-weight="700">03 / SUPERVISE OFFLINE</text><text x="860" y="184" font-size="17" fill="#f2f7fc" font-weight="400">Raspberry Pi 4 gateway</text><text x="860" y="217" font-size="17" fill="#b7c9db" font-weight="400">MQTT broker + rules + logging</text><text x="860" y="250" font-size="17" fill="#b7c9db" font-weight="400">Last-seen worker zones</text><text x="860" y="283" font-size="17" fill="#b7c9db" font-weight="400">Supervisor warnings</text><g stroke="#55dacb" stroke-width="3" fill="none"><path d="M371 218h55m-10-8 10 8-10 8M770 218h55m-10-8 10 8-10 8"/><path d="M998 341v35H198v-35" stroke-dasharray="7 6"/><path d="m190 350 8-9 8 9"/></g><text x="375" y="402" font-size="17" fill="#55dacb" font-weight="400">Warnings returned over the local network</text><text x="36" y="438" font-size="15" fill="#b7c9db" font-weight="400">Dust interface proposed; runoff sensing and airflow-based leak estimation remain wider design scope.</text></svg>