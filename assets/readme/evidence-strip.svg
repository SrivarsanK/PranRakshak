<title id="title">Published design evidence</title><desc id="desc">Four schematic sheets, with zero ERC electrical errors and 68 warnings. Four actual lid meshes; final mesh has 7411 tetrahedra. FEA is assumption-based and selected-metric convergence is numerical evidence only.</desc>
